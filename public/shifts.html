<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الورديات - Ginger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1E1B16; --asphalt: #16305C; --sand: #F3EEE3; --paper: #FFFFFF;
      --orange: #EA4F1E; --nile: #1F6F63; --rust: #B23A1E; --amber: #C97A1A; --line: #E4DCCB; --muted: #8A8272;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Cairo', sans-serif; background: var(--sand); margin: 0; color: var(--ink); }
    .topbar { background: var(--asphalt); color: var(--sand); padding: 16px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 4px solid var(--orange); }
    .topbar img { height: 36px; }
    .topbar h1 { margin: 0; font-size: 16px; font-weight: 700; }
    .back-link { color: var(--sand); opacity: 0.8; font-size: 13px; text-decoration: none; margin-inline-end: auto; }
    .container { max-width: 1150px; margin: 0 auto; padding: 24px; }
    .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .section-head h2 { font-size: 18px; margin: 0; }
    input { padding: 10px 13px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--paper); color: var(--ink); }
    input:focus { outline: 2px solid var(--orange); outline-offset: 1px; }
    .search-input { width: 240px; }
    .panel { background: var(--paper); border-radius: 12px; border: 1px solid var(--line); overflow: hidden; margin-bottom: 30px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 11px 14px; text-align: right; font-size: 13.5px; }
    th { background: var(--asphalt); color: var(--sand); font-weight: 600; font-size: 12px; }
    tbody tr:nth-child(even) { background: #FAF7F0; }
    tbody tr:hover { background: #F3E9DA; }
    td { border-bottom: 1px solid var(--line); }
    .table-scroll { overflow-x: auto; }
    .badge { display: inline-block; padding: 3px 11px; border-radius: 20px; font-size: 11.5px; font-weight: 700; color: white; }
    .badge-open { background: var(--nile); }
    .badge-closed { background: var(--muted); }
    .row-btn { padding: 6px 12px; font-size: 12.5px; border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: 700; font-family: inherit; }
    .btn-delete { background: var(--rust); }
    .empty-row td { text-align: center; color: var(--muted); padding: 26px; }

    .photos-cell { display: flex; gap: 6px; align-items: center; }
    .thumb-wrap { text-align: center; }
    .thumb-wrap .thumb-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
    .thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 7px; cursor: pointer; border: 1px solid var(--line); transition: transform 0.15s; display: block; }
    .thumb:hover { transform: scale(1.15); }
    .no-thumb { width: 44px; height: 44px; background: var(--sand); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 9.5px; color: var(--muted); border: 1px dashed var(--line); }

    .confirm-backdrop { position: fixed; inset: 0; background: rgba(22,19,15,0.55); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; animation: fadeIn 0.18s ease; }
    .confirm-backdrop.open { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .confirm-box { background: var(--paper); border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; border-top: 5px solid var(--rust); text-align: center; animation: popIn 0.22s cubic-bezier(.2,.9,.3,1.2); }
    @keyframes popIn { from { opacity: 0; transform: scale(0.92) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .confirm-box p { font-size: 14.5px; margin: 0 0 18px; line-height: 1.6; }
    .confirm-actions { display: flex; gap: 8px; }
    .confirm-actions button { flex: 1; padding: 11px; border: none; border-radius: 8px; font-weight: 700; font-family: inherit; cursor: pointer; font-size: 14px; }
    .btn-confirm-yes { background: var(--rust); color: white; }
    .btn-confirm-no { background: var(--line); color: var(--ink); }

    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 400; padding: 20px; cursor: zoom-out; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 10px; }
    .lightbox .close-hint { position: absolute; top: 20px; right: 24px; color: white; font-size: 14px; opacity: 0.7; }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: white; padding: 13px 22px; border-radius: 10px; font-size: 14px; font-weight: 600; z-index: 300; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; max-width: 90%; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
    .toast.error { background: var(--rust); }

    .dev-footer {
      margin-top: 40px; padding: 20px 24px; background: #FFFFFF;
      border-top: 1px solid #E4DCCB;
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center;
    }
    .dev-brand { display: flex; align-items: center; gap: 11px; }
    .dev-mark { width: 40px; height: 40px; flex-shrink: 0; }
    .dev-brand-text { line-height: 1.25; }
    .dev-brand-name { font-size: 15px; font-weight: 800; color: #16305C; letter-spacing: 1.5px; }
    .dev-brand-sub { font-size: 8.5px; color: #8A8272; letter-spacing: 1px; font-weight: 600; }
    .dev-divider { width: 1px; height: 34px; background: #E4DCCB; }
    .dev-info { text-align: center; }
    .dev-name { font-size: 13px; font-weight: 800; color: #16305C; }
    .dev-role { font-size: 10.5px; color: #8A8272; margin-top: 1px; }
    .dev-contact {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      background: #25D366; color: white; padding: 8px 16px; border-radius: 22px;
      font-size: 13px; font-weight: 700; transition: filter 0.15s;
    }
    .dev-contact:hover { filter: brightness(0.93); }
    @media (max-width: 560px) {
      .dev-footer { flex-direction: column; gap: 13px; padding: 22px 16px; }
      .dev-divider { display: none; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="/index.html" class="back-link">→ الرئيسية</a>
    <img src="/logo.png" alt="Ginger">
    <h1>الورديات</h1>
  </div>

  <div class="container">
    <div class="section-head"><h2>الورديات المفتوحة حالياً</h2></div>
    <div class="panel table-scroll">
      <table id="openShiftsTable">
        <thead><tr><th>الرقم</th><th>السائق</th><th>التوكتوك</th><th>وقت الحضور</th><th>الصور</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="section-head">
      <h2>سجل كل الورديات</h2>
      <input type="text" id="shiftSearch" class="search-input" placeholder="بحث باسم السائق أو التوكتوك..." oninput="filterShifts()">
    </div>
    <div class="panel table-scroll">
      <table id="shiftsTable">
        <thead><tr><th>الرقم</th><th>السائق</th><th>التوكتوك</th><th>الحضور</th><th>الانصراف</th><th>الصور</th><th>الحالة</th><th>إجراء</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="confirm-backdrop" id="confirmBackdrop">
    <div class="confirm-box">
      <p id="confirmMessage"></p>
      <div class="confirm-actions">
        <button class="btn-confirm-no" onclick="closeConfirm(false)">إلغاء</button>
        <button class="btn-confirm-yes" onclick="closeConfirm(true)">تأكيد</button>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <div class="close-hint">اضغط في أي مكان للإغلاق</div>
    <img id="lightboxImg" src="" alt="">
  </div>

  <div class="toast" id="toast"></div>

  <script>
    fetch('/api/admin-session').then(res => res.json()).then(data => { if (!data.loggedIn) window.location.href = '/login.html'; });
    let allShifts = [];
    let confirmResolve = null;

    function showConfirm(message) {
      document.getElementById('confirmMessage').textContent = message;
      document.getElementById('confirmBackdrop').classList.add('open');
      return new Promise(resolve => { confirmResolve = resolve; });
    }
    function closeConfirm(result) {
      document.getElementById('confirmBackdrop').classList.remove('open');
      if (confirmResolve) confirmResolve(result);
    }
    function showToast(message, isError) {
      const t = document.getElementById('toast');
      t.textContent = message;
      t.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => { t.className = 'toast'; }, 2500);
    }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

        function formatDateTime(d) { return d ? new Date(d).toLocaleString('en-GB') : '-'; }

    function photosCell(s) {
      const checkIn = s.check_in_photo
        ? `<img src="/uploads/${s.check_in_photo}" class="thumb" onclick="openLightbox('/uploads/${s.check_in_photo}')" alt="حضور">`
        : `<div class="no-thumb">لا يوجد</div>`;

      const checkOut = s.check_out_photo
        ? `<img src="/uploads/${s.check_out_photo}" class="thumb" onclick="openLightbox('/uploads/${s.check_out_photo}')" alt="انصراف">`
        : `<div class="no-thumb">${s.check_out_time ? 'لا يوجد' : 'شغال'}</div>`;

      return `
        <div class="photos-cell">
          <div class="thumb-wrap"><div class="thumb-label">حضور</div>${checkIn}</div>
          <div class="thumb-wrap"><div class="thumb-label">انصراف</div>${checkOut}</div>
        </div>
      `;
    }

    function loadOpenShifts() {
      fetch('/shifts').then(res => res.json()).then(data => {
        const openShifts = data.filter(s => s.status === 'open');
        const tbody = document.querySelector('#openShiftsTable tbody');
        if (openShifts.length === 0) {
          tbody.innerHTML = `<tr class="empty-row"><td colspan="5">مفيش ورديات مفتوحة دلوقتي</td></tr>`;
          return;
        }
        tbody.innerHTML = openShifts.map(s => `
          <tr>
            <td>${s.id}</td>
            <td>${s.driver_name}</td>
            <td>${s.tuktuk_number}</td>
            <td>${formatDateTime(s.check_in_time)}</td>
            <td>${photosCell(s)}</td>
          </tr>
        `).join('');
      });
    }

    function loadAllShifts() {
      fetch('/shifts').then(res => res.json()).then(data => {
        allShifts = data;
        renderShifts(data);
      });
    }

    function renderShifts(data) {
      const tbody = document.querySelector('#shiftsTable tbody');
      if (data.length === 0) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="8">مفيش ورديات مسجلة</td></tr>`;
        return;
      }
      const statusLabel = { open: 'مفتوحة', closed: 'مقفولة' };
      tbody.innerHTML = data.map(s => `
        <tr>
          <td>${s.id}</td>
          <td>${s.driver_name}</td>
          <td>${s.tuktuk_number}</td>
          <td>${formatDateTime(s.check_in_time)}</td>
          <td>${formatDateTime(s.check_out_time)}</td>
          <td>${photosCell(s)}</td>
          <td><span class="badge badge-${s.status}">${statusLabel[s.status]}</span></td>
          <td><button class="row-btn btn-delete" onclick="deleteShift(${s.id})">حذف نهائي</button></td>
        </tr>
      `).join('');
    }

    function filterShifts() {
      const q = document.getElementById('shiftSearch').value.trim();
      if (!q) { renderShifts(allShifts); return; }
      renderShifts(allShifts.filter(s =>
        s.driver_name.includes(q) || String(s.tuktuk_number).includes(q)
      ));
    }

    async function deleteShift(id) {
      const confirmed = await showConfirm('⚠️ متأكد إنك عايز تمسح الوردية دي نهائياً؟ الإجراء ده مينفعش يترجع فيه، ولو فيها أوردرات هيرفض الحذف.');
      if (!confirmed) return;

      fetch(`/shifts/${id}`, { method: 'DELETE' })
        .then(res => res.json())
        .then(data => {
          showToast(data.message || data.error, !data.message);
          loadOpenShifts();
          loadAllShifts();
        });
    }

    loadOpenShifts();
    loadAllShifts();
  </script>
  <footer class="dev-footer">
    <div class="dev-brand">
      <svg class="dev-mark" viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">
        <path d="M 34 6 L 58 20 L 58 48 L 34 62 L 10 48 L 10 20 Z" fill="none" stroke="#EA4F1E" stroke-width="3"/>
        <path d="M 26 22 L 26 46 M 26 22 L 44 22 M 26 33 L 40 33" stroke="#EA4F1E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="dev-brand-text">
        <div class="dev-brand-name">FUTURE</div>
        <div class="dev-brand-sub">COMPANY FOR SOLUTIONS</div>
      </div>
    </div>
    <div class="dev-divider"></div>
    <div class="dev-info">
      <div class="dev-name">Dr. Romany Shenoda</div>
      <div class="dev-role">تطوير وصيانة الأنظمة</div>
    </div>
    <a href="https://wa.me/201066696216" target="_blank" class="dev-contact">
      <span>📱</span> 01066696216
    </a>
  </footer>

</body>
</html>
