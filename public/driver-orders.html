<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأوردرات - Ginger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1E1B16; --asphalt: #16305C; --sand: #F3EEE3; --paper: #FFFFFF;
      --orange: #EA4F1E; --nile: #1F6F63; --rust: #B23A1E; --amber: #C97A1A; --line: #E4DCCB; --muted: #8A8272;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Cairo', sans-serif; background: var(--sand); margin: 0; color: var(--ink); }
    .topbar { background: var(--asphalt); color: var(--sand); padding: 16px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 4px solid var(--orange); }
    .topbar img { height: 34px; }
    .topbar h1 { margin: 0; font-size: 15.5px; font-weight: 700; }
    .back-link { color: var(--sand); opacity: 0.85; font-size: 13px; text-decoration: none; margin-inline-end: auto; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 18px 16px; }
    .card { background: var(--paper); border-radius: 14px; padding: 20px; margin-bottom: 16px; border-inline-start: 5px solid var(--line); }
    .card.accent-nile { border-inline-start-color: var(--nile); }
    .card.accent-amber { border-inline-start-color: var(--amber); }
    .card h3 { margin: 0 0 14px; font-size: 16px; }
    select, input { width: 100%; padding: 12px 14px; margin: 6px 0; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; font-family: inherit; background: var(--sand); }
    input:focus, select:focus { outline: 2px solid var(--orange); background: var(--paper); }
    button.action-btn { width: 100%; padding: 13px; border: none; border-radius: 9px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; margin-top: 10px; color: white; }
    .btn-nile { background: var(--nile); }
    .btn-amber { background: var(--amber); }
    .btn-photo { background: var(--asphalt); color: white; font-size: 13.5px; padding: 11px; }
    .photo-preview { max-width: 130px; margin: 10px auto; display: block; border-radius: 10px; }
    .optional-label { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .result { margin-top: 12px; font-size: 13.5px; background: var(--sand); padding: 10px 12px; border-radius: 8px; min-height: 14px; color: #6B6455; }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="/driver.html" class="back-link">→ الرئيسية</a>
    <img src="/logo.png" alt="Ginger">
    <h1>الأوردرات</h1>
  </div>

  <div class="wrap">

    <div class="card accent-nile">
      <h3>فتح أوردر</h3>
      <select id="orderType">
        <option value="delivery">توصيل عميل</option>
        <option value="full_trip">رحلة كاملة</option>
      </select>
      <button class="action-btn btn-nile" onclick="openOrder()">فتح الأوردر</button>
      <div class="result" id="resultOrderOpen">جاهز</div>
    </div>

    <div class="card accent-amber">
      <h3>قفل أوردر</h3>
      <input type="number" id="orderIdClose" placeholder="رقم الأوردر">
      <button class="btn-photo" onclick="capturePhoto('photoInputOrderClose')">📷 صورة توثيق الوصول</button>
      <input type="file" id="photoInputOrderClose" accept="image/*" capture="environment" style="display:none">
      <img id="photoPreviewOrderClose" class="photo-preview" style="display:none">
      <div class="optional-label">صورة اختيارية لتوثيق وصول الأوردر</div>
      <button class="action-btn btn-amber" onclick="closeOrder()">قفل الأوردر</button>
      <div class="result" id="resultOrderClose">جاهز</div>
    </div>

  </div>

  <script>
    let currentDriverId = null;
    let currentShiftId = null;

    fetch('/api/driver-session').then(res => res.json()).then(data => {
      if (!data.loggedIn) { window.location.href = '/driver-login.html'; return; }
      currentDriverId = data.driverId;
      fetch('/shifts/open/' + currentDriverId).then(res => res.json()).then(d => {
        if (d.id) currentShiftId = d.id;
      });
    });

    function capturePhoto(inputId) { document.getElementById(inputId).click(); }
    document.getElementById('photoInputOrderClose').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const preview = document.getElementById('photoPreviewOrderClose');
      const reader = new FileReader();
      reader.onload = ev => { preview.src = ev.target.result; preview.style.display = 'block'; };
      reader.readAsDataURL(file);
    });

    function openOrder() {
      const resultDiv = document.getElementById('resultOrderOpen');
      const order_type = document.getElementById('orderType').value;

      if (!currentShiftId) { resultDiv.textContent = 'لازم تسجل حضور وتفتح وردية الأول'; return; }
      if (!navigator.geolocation) { resultDiv.textContent = 'المتصفح مش بيدعم تحديد الموقع'; return; }

      resultDiv.textContent = 'جاري تحديد موقعك...';

      navigator.geolocation.getCurrentPosition(function(position) {
        resultDiv.textContent = 'جاري فتح الأوردر...';

        fetch('/orders/open', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            shift_id: currentShiftId,
            driver_id: currentDriverId,
            order_type: order_type,
            start_lat: position.coords.latitude,
            start_lng: position.coords.longitude
          })
        })
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            resultDiv.textContent = 'خطأ: ' + data.error;
          } else {
            resultDiv.textContent = data.message + ' - رقم الأوردر: ' + data.order_id;
            document.getElementById('orderIdClose').value = data.order_id;
          }
        })
        .catch(() => { resultDiv.textContent = 'حصل خطأ في الاتصال بالسيرفر'; });
      }, function(error) {
        resultDiv.textContent = 'حصل خطأ في تحديد الموقع: ' + error.message;
      });
    }

    function closeOrder() {
      const resultDiv = document.getElementById('resultOrderClose');
      const order_id = document.getElementById('orderIdClose').value;
      const photoFile = document.getElementById('photoInputOrderClose').files[0];

      if (!order_id) { resultDiv.textContent = 'من فضلك اكتب رقم الأوردر'; return; }
      if (!navigator.geolocation) { resultDiv.textContent = 'المتصفح مش بيدعم تحديد الموقع'; return; }

      resultDiv.textContent = 'جاري تحديد موقعك...';

      navigator.geolocation.getCurrentPosition(function(position) {
        const formData = new FormData();
        formData.append('order_id', order_id);
        formData.append('end_lat', position.coords.latitude);
        formData.append('end_lng', position.coords.longitude);
        if (photoFile) formData.append('photo', photoFile);

        resultDiv.textContent = 'جاري قفل الأوردر...';

        fetch('/orders/close', { method: 'POST', body: formData })
          .then(res => res.json())
          .then(data => {
            if (data.error) {
              resultDiv.textContent = 'خطأ: ' + data.error;
            } else {
              resultDiv.textContent =
                data.message + ' | المسافة: ' + data.distance_km + ' كم | السعر: ' + data.price + ' جنيه | مستحقاتك: ' + data.driver_earning + ' جنيه';
            }
          })
          .catch(() => { resultDiv.textContent = 'حصل خطأ في الاتصال بالسيرفر'; });
      }, function(error) {
        resultDiv.textContent = 'حصل خطأ في تحديد الموقع: ' + error.message;
      });
    }
  </script>
</body>
</html>
