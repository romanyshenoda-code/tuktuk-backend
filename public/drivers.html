<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>السواقين - Ginger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1E1B16; --asphalt: #16305C; --sand: #F3EEE3; --paper: #FFFFFF;
      --orange: #EA4F1E; --nile: #1F6F63; --rust: #B23A1E; --amber: #C97A1A; --line: #E4DCCB; --muted: #8A8272;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Cairo', sans-serif; background: var(--sand); margin: 0; color: var(--ink); }

    .topbar {
      background: var(--asphalt); color: var(--sand); padding: 16px 24px;
      display: flex; align-items: center; gap: 12px; border-bottom: 4px solid var(--orange);
    }
    .topbar img { height: 36px; }
    .topbar h1 { margin: 0; font-size: 16px; font-weight: 700; }
    .back-link { color: var(--sand); opacity: 0.8; font-size: 13px; text-decoration: none; margin-inline-end: auto; }

    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }

    .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .section-head h2 { font-size: 18px; margin: 0; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    input, select { padding: 10px 13px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--paper); color: var(--ink); }
    input:focus { outline: 2px solid var(--orange); outline-offset: 1px; }
    .search-input { width: 240px; }

    .add-square { width: 40px; height: 40px; border-radius: 10px; background: var(--orange); color: white; border: none; font-size: 22px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; padding: 0; }
    .add-square:hover { transform: scale(1.06); }

    .panel { background: var(--paper); border-radius: 12px; border: 1px solid var(--line); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 11px 14px; text-align: right; font-size: 13.5px; }
    th { background: var(--asphalt); color: var(--sand); font-weight: 600; font-size: 12px; }
    tbody tr:nth-child(even) { background: #FAF7F0; }
    tbody tr:hover { background: #F3E9DA; }
    td { border-bottom: 1px solid var(--line); }
    .table-scroll { overflow-x: auto; }

    .badge { display: inline-block; padding: 3px 11px; border-radius: 20px; font-size: 11.5px; font-weight: 700; color: white; background: var(--nile); }

    .row-btn { padding: 6px 12px; font-size: 12.5px; border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: 700; font-family: inherit; }
    .btn-delete { background: var(--rust); }

    .empty-row td { text-align: center; color: var(--muted); padding: 26px; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(22,19,15,0.55); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; animation: fadeIn 0.18s ease; }
    .modal-backdrop.open { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-box { background: var(--paper); border-radius: 16px; padding: 26px; width: 100%; max-width: 400px; border-top: 5px solid var(--orange); animation: popIn 0.22s cubic-bezier(.2,.9,.3,1.2); }
    @keyframes popIn { from { opacity: 0; transform: scale(0.92) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .modal-box h3 { margin: 0 0 4px; font-size: 18px; }
    .modal-box .modal-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 18px; }
    .modal-box input { width: 100%; margin-bottom: 10px; }
    .modal-box .hint { font-size: 11.5px; color: var(--muted); margin: -4px 0 12px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 6px; }
    .modal-actions button { flex: 1; padding: 11px; border: none; border-radius: 8px; font-weight: 700; font-family: inherit; cursor: pointer; font-size: 14px; }
    .btn-modal-save { background: var(--orange); color: white; }
    .btn-modal-cancel { background: var(--line); color: var(--ink); }
    .form-msg { padding: 8px 4px 0; font-size: 13px; font-weight: 600; color: var(--nile); min-height: 14px; }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="/index.html" class="back-link">→ الرئيسية</a>
    <img src="/logo.png" alt="Ginger">
    <h1>السواقين</h1>
  </div>

  <div class="container">
    <div class="section-head">
      <h2>قائمة السواقين</h2>
      <div class="toolbar">
        <input type="text" id="driverSearch" class="search-input" placeholder="بحث بالاسم أو التليفون..." oninput="filterDrivers()">
        <button class="add-square" onclick="openModal('driverModal')" title="إضافة سائق">+</button>
      </div>
    </div>
    <div class="panel table-scroll">
      <table id="driversTable">
        <thead><tr><th>الرقم</th><th>الاسم</th><th>التليفون</th><th>الرقم القومي</th><th>تاريخ التعيين</th><th>الحالة</th><th>إجراء</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="modal-backdrop" id="driverModal">
    <div class="modal-box">
      <h3>إضافة سائق جديد</h3>
      <div class="modal-sub">هيتسجل تاريخ التعيين تلقائي بتاريخ النهاردة</div>
      <form id="addDriverForm">
        <input type="text" id="newName" placeholder="الاسم" required>
        <input type="text" id="newPhone" placeholder="رقم التليفون" required>
        <input type="text" id="newNationalId" placeholder="الرقم القومي">
        <input type="password" id="newPassword" placeholder="كلمة مرور دخول السائق" required>
        <div class="hint">السائق هيستخدم رقمه والباسورد ده لدخول صفحته الشخصية</div>
        <div class="modal-actions">
          <button type="button" class="btn-modal-cancel" onclick="closeModal('driverModal')">إلغاء</button>
          <button type="submit" class="btn-modal-save">حفظ السائق</button>
        </div>
      </form>
      <div id="addDriverMsg" class="form-msg"></div>
    </div>
  </div>

  <script>
    let allDrivers = [];

    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    document.querySelectorAll('.modal-backdrop').forEach(b => b.addEventListener('click', e => { if (e.target === b) b.classList.remove('open'); }));

    function formatDate(d) { return d ? new Date(d).toLocaleDateString('ar-EG') : '-'; }

    function loadDrivers() {
      fetch('/drivers').then(res => res.json()).then(data => {
        allDrivers = data;
        renderDrivers(data);
      });
    }

    function renderDrivers(data) {
      const tbody = document.querySelector('#driversTable tbody');
      if (data.length === 0) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="7">مفيش سواقين لسه</td></tr>`;
        return;
      }
           tbody.innerHTML = data.map(d => `
        <tr>
          <td>${d.id}</td>
          <td>${d.name}</td>
          <td>${d.phone}</td>
          <td>${d.national_id || '-'}</td>
          <td>${formatDate(d.created_at)}</td>
          <td><span class="badge">${d.status === 'active' ? 'نشط' : 'غير نشط'}</span></td>
          <td>
            <button class="row-btn btn-active" onclick="changePassword(${d.id})">تغيير الباسورد</button>
            <button class="row-btn btn-delete" onclick="deleteDriver(${d.id})">حذف نهائي</button>
          </td>
        </tr>
      `).join('');
    }

    function filterDrivers() {
      const q = document.getElementById('driverSearch').value.trim();
      if (!q) { renderDrivers(allDrivers); return; }
      renderDrivers(allDrivers.filter(d => d.name.includes(q) || d.phone.includes(q)));
    }

    function deleteDriver(id) {
      if (!confirm('متأكد إنك عايز تمسح السائق ده نهائياً؟ الإجراء ده مينفعش يترجع فيه.')) return;
      fetch(`/drivers/${id}`, { method: 'DELETE' })
        .then(res => res.json())
        .then(data => {
          alert(data.message || data.error);
          loadDrivers();
        });
    }
        function changePassword(id) {
      const newPassword = prompt('اكتب الباسورد الجديد للسائق:');
      if (!newPassword) return;

      fetch(`/drivers/${id}/password`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: newPassword })
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message || data.error);
      });
    }

    document.getElementById('addDriverForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('newName').value;
      const phone = document.getElementById('newPhone').value;
      const national_id = document.getElementById('newNationalId').value;
      const password = document.getElementById('newPassword').value;

      fetch('/drivers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone, national_id, password })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById('addDriverMsg').textContent = data.message || data.error;
        if (data.message) {
          document.getElementById('addDriverForm').reset();
          loadDrivers();
          setTimeout(() => closeModal('driverModal'), 700);
        }
      });
    });

    loadDrivers();
  </script>
</body>
</html>
