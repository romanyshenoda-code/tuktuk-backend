<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول الأدمن - Ginger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #1E1B16; --asphalt: #16305C; --sand: #F3EEE3; --paper: #FFFFFF; --orange: #EA4F1E; --rust: #B23A1E; }
    * { box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--asphalt);
      display: flex; justify-content: center; align-items: center;
      height: 100vh; margin: 0;
    }
    .box {
      background: var(--paper); padding: 34px 30px; border-radius: 16px;
      width: 90%; max-width: 340px; text-align: center;
      border-top: 5px solid var(--orange);
    }
    .box img { height: 56px; margin-bottom: 14px; }
    .box h2 { margin: 0 0 4px; font-size: 18px; color: var(--ink); }
    .box .sub { font-size: 11.5px; color: #8A8272; margin-bottom: 22px; letter-spacing: 0.3px; }
    input {
      width: 100%; padding: 12px 14px; margin: 7px 0; border: 1px solid #E4DCCB;
      border-radius: 8px; box-sizing: border-box; font-size: 15px; font-family: inherit; background: var(--sand);
    }
    input:focus { outline: 2px solid var(--orange); background: var(--paper); }
    button {
      width: 100%; padding: 12px; background: var(--orange); color: white; border: none;
      border-radius: 8px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; margin-top: 12px;
    }
    button:hover { filter: brightness(0.95); }
    #msg { color: var(--rust); margin-top: 10px; font-size: 13.5px; min-height: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/logo.png" alt="Ginger">
    <h2>تسجيل دخول الأدمن</h2>
    <div class="sub">GINGER — SPICE UP THE ORDINARY</div>
    <input type="text" id="username" placeholder="اسم المستخدم">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
    <div id="msg"></div>
  </div>

  <script>
    function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!username || !password) {
        document.getElementById('msg').textContent = 'من فضلك اكتب اسم المستخدم والباسورد';
        return;
      }

      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.message) {
          window.location.href = '/';
        } else {
          document.getElementById('msg').textContent = data.error;
        }
      });
    }

    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
