<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول قسم المالية - Ginger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #1E1B16; --asphalt: #16305C; --sand: #F3EEE3; --paper: #FFFFFF; --orange: #EA4F1E; --rust: #B23A1E; --nile: #1F6F63; }
    * { box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif; margin: 0; min-height: 100vh;
      background: linear-gradient(160deg, var(--asphalt) 0%, #0F2244 100%);
      display: flex; justify-content: center; align-items: center; padding: 20px 20px 110px;
    }
    .box {
      background: var(--paper); padding: 34px 30px; border-radius: 18px;
      width: 100%; max-width: 350px; text-align: center;
      border-top: 6px solid var(--nile); box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .lock-icon { font-size: 36px; margin-bottom: 10px; }
    .box img { height: 48px; margin-bottom: 10px; }
    .box h2 { margin: 0 0 4px; font-size: 17px; color: var(--ink); }
    .box .sub { font-size: 12px; color: #8A8272; margin-bottom: 22px; }
    input {
      width: 100%; padding: 12px 14px; margin: 7px 0; border: 1px solid #E4DCCB;
      border-radius: 8px; box-sizing: border-box; font-size: 15px; font-family: inherit; background: var(--sand);
    }
    input:focus { outline: 2px solid var(--nile); background: var(--paper); }
    button {
      width: 100%; padding: 12px; background: var(--nile); color: white; border: none;
      border-radius: 8px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; margin-top: 12px;
    }
    button:hover { filter: brightness(0.95); }
    #msg { color: var(--rust); margin-top: 10px; font-size: 13.5px; min-height: 14px; }

    .dev-footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 13px 20px; background: rgba(255,255,255,0.07);
      backdrop-filter: blur(6px); border-top: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center;
    }
    .dev-brand { display: flex; align-items: center; gap: 11px; }
    .dev-mark { width: 34px; height: 34px; flex-shrink: 0; }
    .dev-brand-text { line-height: 1.25; }
    .dev-brand-name { font-size: 14px; font-weight: 800; color: #F3EEE3; letter-spacing: 1.5px; }
    .dev-brand-sub { font-size: 8px; color: rgba(243,238,227,0.6); letter-spacing: 1px; font-weight: 600; }
    .dev-divider { width: 1px; height: 30px; background: rgba(255,255,255,0.15); }
    .dev-info { text-align: center; }
    .dev-name { font-size: 12.5px; font-weight: 800; color: #F3EEE3; }
    .dev-role { font-size: 10px; color: rgba(243,238,227,0.6); margin-top: 1px; }
    .dev-contact {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      background: #25D366; color: white; padding: 7px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 700; transition: filter 0.15s;
    }
    .dev-contact:hover { filter: brightness(0.93); }
    @media (max-width: 560px) {
      .dev-footer { flex-direction: column; gap: 13px; padding: 22px 16px; }
      .dev-divider { display: none; }
    }
  
    .password-wrap { position: relative; }
    .password-wrap input { padding-inline-end: 42px !important; }
    .toggle-eye {
      position: absolute; top: 50%; transform: translateY(-50%);
      inset-inline-end: 12px; cursor: pointer; font-size: 17px;
      background: none; border: none; padding: 0; line-height: 1;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="lock-icon">🔐</div>
    <img src="/logo.png" alt="Ginger">
    <h2>قسم المالية والرواتب</h2>
    <div class="sub">دخول محمي — للمخوّلين فقط</div>
    <div class="password-wrap">
      <input type="password" id="password" placeholder="كلمة المرور الخاصة بالمالية">
      <button type="button" class="toggle-eye" id="eyePassword" onclick="togglePasswordVisibility('password', 'eyePassword')">👁️</button>
    </div>
    <button onclick="login()">دخول</button>
    <div id="msg"></div>
  </div>

  <script>
    function togglePasswordVisibility(inputId, eyeId) {
      const input = document.getElementById(inputId);
      const eye = document.getElementById(eyeId);
      if (input.type === 'password') { input.type = 'text'; eye.textContent = '🙈'; }
      else { input.type = 'password'; eye.textContent = '👁️'; }
    }

    function login() {
      const password = document.getElementById('password').value;
      if (!password) { document.getElementById('msg').textContent = 'من فضلك اكتب الباسورد'; return; }

      fetch('/api/finance-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.message) {
          window.location.href = '/finance.html';
        } else {
          document.getElementById('msg').textContent = data.error;
        }
      });
    }

    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') login();
    });
  </script>
  <footer class="dev-footer">
    <div class="dev-brand">
      <svg class="dev-mark" viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">
        <path d="M 34 6 L 58 20 L 58 48 L 34 62 L 10 48 L 10 20 Z" fill="none" stroke="#EA4F1E" stroke-width="3"/>
        <path d="M 26 22 L 26 46 M 26 22 L 44 22 M 26 33 L 40 33" stroke="#EA4F1E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="dev-brand-text">
        <div class="dev-brand-name">FUTURE</div>
        <div class="dev-brand-sub">COMPANY FOR SOLUTIONS</div>
      </div>
    </div>
    <div class="dev-divider"></div>
    <div class="dev-info">
      <div class="dev-name">Dr. Romany Shenoda</div>
      <div class="dev-role">تطوير وصيانة الأنظمة</div>
    </div>
    <a href="https://wa.me/201066696216" target="_blank" class="dev-contact">
      <span>📱</span> 01066696216
    </a>
  </footer>

</body>
</html>
