<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول قسم المالية - Ginger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #1E1B16; --asphalt: #16305C; --sand: #F3EEE3; --paper: #FFFFFF; --orange: #EA4F1E; --rust: #B23A1E; --nile: #1F6F63; }
    * { box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif; margin: 0; min-height: 100vh;
      background: linear-gradient(160deg, var(--asphalt) 0%, #0F2244 100%);
      display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    .box {
      background: var(--paper); padding: 34px 30px; border-radius: 18px;
      width: 100%; max-width: 350px; text-align: center;
      border-top: 6px solid var(--nile); box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .lock-icon { font-size: 36px; margin-bottom: 10px; }
    .box img { height: 48px; margin-bottom: 10px; }
    .box h2 { margin: 0 0 4px; font-size: 17px; color: var(--ink); }
    .box .sub { font-size: 12px; color: #8A8272; margin-bottom: 22px; }
    input {
      width: 100%; padding: 12px 14px; margin: 7px 0; border: 1px solid #E4DCCB;
      border-radius: 8px; box-sizing: border-box; font-size: 15px; font-family: inherit; background: var(--sand);
    }
    input:focus { outline: 2px solid var(--nile); background: var(--paper); }
    button {
      width: 100%; padding: 12px; background: var(--nile); color: white; border: none;
      border-radius: 8px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; margin-top: 12px;
    }
    button:hover { filter: brightness(0.95); }
    #msg { color: var(--rust); margin-top: 10px; font-size: 13.5px; min-height: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="lock-icon">🔐</div>
    <img src="/logo.png" alt="Ginger">
    <h2>قسم المالية والرواتب</h2>
    <div class="sub">دخول محمي — للمخوّلين فقط</div>
    <input type="password" id="password" placeholder="كلمة المرور الخاصة بالمالية">
    <button onclick="login()">دخول</button>
    <div id="msg"></div>
  </div>

  <script>
    function login() {
      const password = document.getElementById('password').value;
      if (!password) { document.getElementById('msg').textContent = 'من فضلك اكتب الباسورد'; return; }

      fetch('/api/finance-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.message) {
          window.location.href = '/finance.html';
        } else {
          document.getElementById('msg').textContent = data.error;
        }
      });
    }

    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
