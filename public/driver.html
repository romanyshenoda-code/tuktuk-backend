<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحة السائق - Ginger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1E1B16; --asphalt: #16305C; --sand: #F3EEE3; --paper: #FFFFFF;
      --orange: #EA4F1E; --nile: #1F6F63; --rust: #B23A1E; --amber: #C97A1A; --line: #E4DCCB; --muted: #8A8272;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Cairo', sans-serif; background: var(--sand); margin: 0; color: var(--ink); }

    .topbar {
      background: var(--asphalt); color: var(--sand); padding: 16px 20px;
      display: flex; align-items: center; gap: 12px; border-bottom: 4px solid var(--orange);
      position: sticky; top: 0; z-index: 50;
    }
    .topbar img { height: 38px; }
    .topbar h2 { margin: 0; font-size: 16px; font-weight: 700; }
    .topbar .sub { font-size: 10.5px; opacity: 0.7; }
    .bell-wrap { margin-inline-start: auto; position: relative; cursor: pointer; }
    .bell-btn { background: rgba(255,255,255,0.12); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; }
    .bell-badge {
      position: absolute; top: -4px; left: -4px; background: var(--orange); color: white;
      font-size: 10.5px; font-weight: 800; min-width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; padding: 0 3px;
    }
    .logout-link { color: rgba(255,255,255,0.75); font-size: 12px; text-decoration: none; }

    .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px; }
    .greeting { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .greeting-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 24px; }

    .modules-grid { display: grid; gap: 14px; }
    .module-card {
      background: var(--paper); border-radius: 16px; padding: 22px 18px;
      display: flex; align-items: center; gap: 16px;
      text-decoration: none; color: var(--ink); border: 1px solid var(--line);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      animation: riseIn 0.4s ease backwards; cursor: pointer;
    }
    .module-card:active { transform: scale(0.98); }
    .module-card:hover { box-shadow: 0 10px 24px rgba(22,48,92,0.12); }
    .module-card .icon-box {
      width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
    }
    .module-card .txt h3 { margin: 0 0 3px; font-size: 16px; }
    .module-card .txt p { margin: 0; font-size: 12px; color: var(--muted); }
    .module-card:nth-child(1) .icon-box { background: #FDEBE3; color: var(--orange); }
    .module-card:nth-child(1) { animation-delay: 0.03s; }
    .module-card:nth-child(2) .icon-box { background: #E3EEEC; color: var(--nile); }
    .module-card:nth-child(2) { animation-delay: 0.09s; }
    .module-card:nth-child(3) .icon-box { background: #FBF0DF; color: var(--amber); }
    .module-card:nth-child(3) { animation-delay: 0.15s; }

    @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* لوحة الإشعارات */
    .notif-backdrop {
      position: fixed; inset: 0; background: rgba(22,19,15,0.5); display: none;
      z-index: 100; justify-content: flex-end;
    }
    .notif-backdrop.open { display: flex; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .notif-panel {
      background: var(--paper); width: 100%; max-width: 340px; height: 100%;
      padding: 20px; overflow-y: auto; animation: slideIn 0.25s ease;
    }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .notif-panel h3 { margin: 0 0 16px; font-size: 17px; }
    .notif-close { float: left; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted); }
    .notification-item { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; line-height: 1.6; }
    .notification-item:last-child { border-bottom: none; }
    .notification-unread { font-weight: 700; }
    .notif-date { font-size: 11px; color: var(--muted); margin-top: 4px; font-weight: 400; }
    .empty-note { color: var(--muted); font-size: 13.5px; text-align: center; padding: 30px 0; }
  </style>
</head>
<body>

  <div class="topbar">
    <img src="/logo.png" alt="Ginger">
    <div>
      <h2 id="driverNameDisplay">جاري التحميل...</h2>
      <div class="sub">GINGER — SPICE UP THE ORDINARY</div>
    </div>
    <div class="bell-wrap" onclick="openNotifications()">
      <button class="bell-btn">🔔</button>
      <span class="bell-badge" id="notifBadge" style="display:none;">0</span>
    </div>
  </div>

  <div class="wrap">
    <div class="greeting" id="greetingText">أهلاً بيك</div>
    <div class="greeting-sub">اختار اللي عايز تعمله دلوقتي</div>

    <div class="modules-grid">
      <a href="/driver-attendance.html" class="module-card">
        <div class="icon-box">🕐</div>
        <div class="txt">
          <h3>الحضور والانصراف</h3>
          <p id="shiftStatusText">سجل حضورك وابدأ يومك</p>
        </div>
      </a>

      <a href="/driver-orders.html" class="module-card">
        <div class="icon-box">📦</div>
        <div class="txt">
          <h3>الأوردرات</h3>
          <p>فتح وقفل رحلاتك اليومية</p>
        </div>
      </a>

      <a href="/driver-requests.html" class="module-card">
        <div class="icon-box">📋</div>
        <div class="txt">
          <h3>الطلبات</h3>
          <p>إجازة أو سلفة</p>
        </div>
      </a>
    </div>
  </div>

  <div class="notif-backdrop" id="notifBackdrop" onclick="if(event.target===this) closeNotifications()">
    <div class="notif-panel">
      <button class="notif-close" onclick="closeNotifications()">×</button>
      <h3>🔔 الإشعارات</h3>
      <div id="notificationsList"><div class="empty-note">مفيش إشعارات جديدة</div></div>
    </div>
  </div>

  <script>
    let currentDriverId = null;

    fetch('/api/driver-session')
      .then(res => res.json())
      .then(data => {
        if (!data.loggedIn) {
          window.location.href = '/driver-login.html';
          return;
        }
        currentDriverId = data.driverId;
        document.getElementById('driverNameDisplay').textContent = data.driverName;
        document.getElementById('greetingText').textContent = 'أهلاً بيك يا ' + data.driverName;
        loadNotifications();
        checkShiftStatus();
      });

    function checkShiftStatus() {
      fetch('/shifts/open/' + currentDriverId)
        .then(res => res.json())
        .then(data => {
          if (data.id) {
            document.getElementById('shiftStatusText').textContent = 'وردية شغالة دلوقتي ✓';
          }
        });
    }

    function loadNotifications() {
      fetch('/notifications/driver/' + currentDriverId)
        .then(res => res.json())
        .then(data => {
          const list = document.getElementById('notificationsList');
          const unreadCount = data.filter(n => !n.is_read).length;
          const badge = document.getElementById('notifBadge');
          if (unreadCount > 0) {
            badge.style.display = 'flex';
            badge.textContent = unreadCount;
          } else {
            badge.style.display = 'none';
          }

          if (data.length === 0) {
            list.innerHTML = '<div class="empty-note">مفيش إشعارات جديدة</div>';
            return;
          }
          list.innerHTML = data.map(n => `
            <div class="notification-item ${n.is_read ? '' : 'notification-unread'}" onclick="markRead(${n.id}, this)">
              <div>${n.message}</div>
              <div class="notif-date">${new Date(n.created_at).toLocaleString('ar-EG')}</div>
            </div>
          `).join('');
        });
    }

    function markRead(id, el) {
      el.classList.remove('notification-unread');
      fetch(`/notifications/${id}/read`, { method: 'PUT' }).then(() => loadNotifications());
    }

    function openNotifications() {
      document.getElementById('notifBackdrop').classList.add('open');
    }
    function closeNotifications() {
      document.getElementById('notifBackdrop').classList.remove('open');
    }
  </script>
</body>
</html>
