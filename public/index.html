<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الأدمن - Ginger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1E1B16; --asphalt: #16305C; --sand: #F3EEE3; --paper: #FFFFFF;
      --orange: #EA4F1E; --nile: #1F6F63; --rust: #B23A1E; --amber: #C97A1A; --muted: #8A8272; --line: #E4DCCB;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Cairo', sans-serif; background: var(--sand); margin: 0; color: var(--ink); }

    .topbar { background: var(--asphalt); color: var(--sand); padding: 16px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 4px solid var(--orange); }
    .topbar img { height: 40px; }
    .topbar h1 { margin: 0; font-size: 17px; font-weight: 700; }
    .topbar .sub { font-size: 11px; opacity: 0.7; letter-spacing: 0.3px; }
    .logout-link { margin-inline-start: auto; color: var(--sand); opacity: 0.75; font-size: 13px; text-decoration: none; border: 1px solid rgba(255,255,255,0.25); padding: 6px 12px; border-radius: 20px; }

    .container { max-width: 1100px; margin: 0 auto; padding: 22px 24px 40px; }

    /* شريط الإحصائيات السريعة */
    .quick-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .qs-card { background: var(--paper); border-radius: 10px; padding: 11px 10px; text-align: center; border-top: 3px solid var(--line); }
    .qs-card.top { border-top-color: var(--nile); }
    .qs-card.maint { border-top-color: var(--rust); }
    .qs-card.avg { border-top-color: var(--amber); }
    .qs-card .qs-value { font-size: 16px; font-weight: 800; line-height: 1.3; }
    .qs-card .qs-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

    /* التنبيهات */
    .alerts-box { margin-bottom: 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .alerts-header { padding: 8px 13px; background: #FAF7F0; border-bottom: 1px solid var(--line); font-size: 11.5px; font-weight: 800; color: var(--muted); }
    .alerts-wrap { max-height: 92px; overflow-y: auto; display: flex; flex-direction: column; }
    .alerts-wrap::-webkit-scrollbar { width: 5px; }
    .alerts-wrap::-webkit-scrollbar-track { background: #FAF7F0; }
    .alerts-wrap::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
    .alerts-wrap::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    .alert-item { padding: 6px 13px; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #F5F0E6; line-height: 1.4; }
    .alert-item:last-child { border-bottom: none; }
    .alert-item.warning { border-inline-start: 3px solid var(--amber); color: #8A5F12; }
    .alert-item.danger { border-inline-start: 3px solid var(--rust); color: #8B2A15; }

    .container h2 { font-size: 19px; margin: 0 0 16px; }

    .modules-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    @media (min-width: 700px) { .modules-grid { grid-template-columns: repeat(3, 1fr); } }

    .module-card {
      background: var(--paper); border-radius: 16px; padding: 34px 16px; text-align: center;
      text-decoration: none; color: var(--ink); border: 1px solid var(--line);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      animation: riseIn 0.4s ease backwards; display: block; position: relative;
    }
    .module-card:hover { transform: translateY(-5px); box-shadow: 0 12px 26px rgba(22,48,92,0.16); }
    .module-card .icon { font-size: 38px; margin-bottom: 10px; }
    .module-card .count { font-size: 32px; font-weight: 800; }
    .module-card .label { font-size: 14px; color: var(--muted); margin-top: 4px; }
    .module-card:nth-child(1) { border-top: 5px solid var(--orange); animation-delay: 0.02s; }
    .module-card:nth-child(2) { border-top: 5px solid var(--asphalt); animation-delay: 0.08s; }
    .module-card:nth-child(3) { border-top: 5px solid var(--nile); animation-delay: 0.14s; }
    .module-card:nth-child(4) { border-top: 5px solid var(--amber); animation-delay: 0.20s; }
    .module-card:nth-child(5) { border-top: 5px solid var(--rust); animation-delay: 0.26s; }
    .module-card:nth-child(6) { border-top: 5px solid var(--asphalt); animation-delay: 0.32s; }
    .module-card:nth-child(7) { border-top: 5px solid var(--nile); animation-delay: 0.38s; }

    @keyframes riseIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .alert-dot {
      position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      background: var(--rust); color: white; font-size: 14px; font-weight: 800;
      min-width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 3px solid var(--paper); padding: 0 4px;
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(178,58,30,0.45); }
      70% { box-shadow: 0 0 0 8px rgba(178,58,30,0); }
      100% { box-shadow: 0 0 0 0 rgba(178,58,30,0); }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <img src="/logo.png" alt="Ginger">
    <div>
      <h1>لوحة تحكم الأدمن</h1>
      <div class="sub">GINGER — SPICE UP THE ORDINARY</div>
    </div>
    <a href="/api/logout" class="logout-link">خروج</a>
  </div>

  <div class="container">

    <div class="quick-stats">
      <div class="qs-card top">
        <div class="qs-value" id="qsTopDriver">-</div>
        <div class="qs-label">أعلى سائق إيراداً</div>
      </div>
      <div class="qs-card maint">
        <div class="qs-value" id="qsTopMaint">-</div>
        <div class="qs-label">أكتر توكتوك صيانة</div>
      </div>
      <div class="qs-card avg">
        <div class="qs-value" id="qsAvgOrders">-</div>
        <div class="qs-label">متوسط أوردر/يوم</div>
      </div>
    </div>

    <div class="alerts-box" id="alertsBox" style="display:none;">
      <div class="alerts-header" id="alertsHeader"></div>
      <div class="alerts-wrap" id="alertsWrap"></div>
    </div>

    <h2>اختار القسم اللي عايز تديره</h2>
    <div class="modules-grid">
      <a href="/drivers.html" class="module-card">
        <div class="icon">🧑‍✈️</div>
        <div class="count" id="countDrivers">-</div>
        <div class="label">السواقين</div>
      </a>
      <a href="/tuktuks.html" class="module-card">
        <div class="icon">🛺</div>
        <div class="count" id="countTuktuks">-</div>
        <div class="label">التوكتوكات</div>
      </a>
      <a href="/shifts.html" class="module-card">
        <div class="icon">🕐</div>
        <div class="count" id="countShiftsOpen">-</div>
        <div class="label">ورديات شغالة</div>
      </a>
      <a href="/orders.html" class="module-card">
        <div class="icon">📦</div>
        <div class="count" id="countOrdersOpen">-</div>
        <div class="label">أوردرات شغالة</div>
      </a>
      <a href="/hr.html" class="module-card">
        <div id="hrAlertDot"></div>
        <div class="icon">📋</div>
        <div class="count" id="countPendingRequests">-</div>
        <div class="label">طلبات معلّقة</div>
      </a>
      <a href="/finance-login.html" class="module-card">
        <div class="icon">💰</div>
        <div class="count">🔐</div>
        <div class="label">المالية والرواتب</div>
      </a>
      <a href="/admins.html" class="module-card">
        <div class="icon">🛡️</div>
        <div class="count" id="countAdmins">-</div>
        <div class="label">مشرفين</div>
      </a>
    </div>
  </div>

  <script>
    fetch('/drivers').then(r => r.json()).then(d => document.getElementById('countDrivers').textContent = d.length);
    fetch('/tuktuks').then(r => r.json()).then(d => document.getElementById('countTuktuks').textContent = d.length);
    fetch('/shifts').then(r => r.json()).then(d => document.getElementById('countShiftsOpen').textContent = d.filter(s => s.status === 'open').length);
    fetch('/orders/active').then(r => r.json()).then(d => document.getElementById('countOrdersOpen').textContent = d.length);
    fetch('/admins').then(r => r.json()).then(d => document.getElementById('countAdmins').textContent = d.length);

    Promise.all([
      fetch('/leave-requests').then(r => r.json()),
      fetch('/advances').then(r => r.json())
    ]).then(([leaves, advances]) => {
      const pending = leaves.filter(l => l.status === 'pending').length + advances.filter(a => a.status === 'pending').length;
      const el = document.getElementById('countPendingRequests');
      el.textContent = pending;

      if (pending > 0) {
        const dot = document.createElement('div');
        dot.className = 'alert-dot';
        dot.textContent = pending;
        document.getElementById('hrAlertDot').appendChild(dot);
      }
    });

    // الإحصائيات السريعة
    fetch('/dashboard/stats')
      .then(r => r.json())
      .then(s => {
        document.getElementById('qsTopDriver').textContent = s.top_driver ? s.top_driver.name : 'لا يوجد';
        document.getElementById('qsTopMaint').textContent = s.top_maintenance
          ? `${s.top_maintenance.tuktuk_number} (${s.top_maintenance.times}×)`
          : 'لا يوجد';
        document.getElementById('qsAvgOrders').textContent = s.avg_orders_per_day;
      })
      .catch(() => {
        document.getElementById('qsTopDriver').textContent = '-';
        document.getElementById('qsTopMaint').textContent = '-';
        document.getElementById('qsAvgOrders').textContent = '-';
      });

    // تنبيهات
    fetch('/dashboard/alerts')
      .then(r => r.json())
      .then(alerts => {
        const box = document.getElementById('alertsBox');
        const wrap = document.getElementById('alertsWrap');
        const header = document.getElementById('alertsHeader');

        if (!alerts || alerts.length === 0) {
          box.style.display = 'none';
          return;
        }

        box.style.display = 'block';
        header.textContent = '⚠️ ' + alerts.length + ' ' + (alerts.length === 1 ? 'تنبيه' : 'تنبيهات') + ' تحتاج انتباهك';

        wrap.innerHTML = alerts.map(a => `
          <div class="alert-item ${a.type}">
            ${a.type === 'danger' ? '🔴' : '⚠️'} ${a.message}
          </div>
        `).join('');
      })
      .catch(() => {});
  </script>
</body>
</html>
